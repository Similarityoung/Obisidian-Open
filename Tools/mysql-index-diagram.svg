<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#246BFD"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; fill: #17212B; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 20px; fill: #66727D; }
      .panel-title { font-size: 24px; font-weight: 700; }
      .panel-subtitle { font-size: 16px; fill: #66727D; }
      .label { font-size: 15px; fill: #66727D; }
      .code { font-family: "SFMono-Regular", "Menlo", "Noto Sans Mono CJK SC", monospace; }
      .node-title { font-size: 14px; font-weight: 600; fill: #66727D; }
      .cell { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; }
      .highlight { fill: #C45500; font-weight: 700; }
      .note-title { font-size: 18px; font-weight: 700; }
      .note { font-size: 16px; fill: #44515C; }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="#F7F3EA"/>
  <circle cx="1490" cy="88" r="150" fill="#E9F0FF"/>
  <circle cx="88" cy="1010" r="190" fill="#FFF0D4"/>

  <text x="70" y="76" class="title">MySQL 回表：一条查询走了哪两棵树</text>
  <text x="72" y="112" class="subtitle">InnoDB 中，主键索引和普通索引的叶子节点保存的内容不同</text>

  <rect x="70" y="145" width="1460" height="90" rx="18" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
  <rect x="94" y="166" width="96" height="46" rx="10" fill="#EAF0FF"/>
  <text x="119" y="197" class="cell code" fill="#246BFD">SQL</text>
  <text x="216" y="197" class="code" font-size="22" font-weight="600">SELECT email FROM users WHERE name = 'Alice';</text>
  <text x="1247" y="197" class="label">name 有普通索引；id 是主键</text>

  <!-- 二级索引面板 -->
  <rect x="70" y="275" width="650" height="560" rx="24" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
  <rect x="94" y="299" width="52" height="38" rx="19" fill="#EAF0FF"/>
  <text x="107" y="326" font-size="22" font-weight="700" fill="#246BFD">1</text>
  <text x="162" y="327" class="panel-title">二级索引 idx_name</text>
  <text x="162" y="357" class="panel-subtitle">叶子节点只保存：索引列 + 主键</text>

  <text x="115" y="400" class="node-title">ROOT PAGE</text>
  <rect x="265" y="390" width="260" height="64" rx="13" fill="#F5F8FF" stroke="#246BFD" stroke-width="2"/>
  <line x1="352" y1="392" x2="352" y2="452" stroke="#C9D8FF" stroke-width="2"/>
  <line x1="438" y1="392" x2="438" y2="452" stroke="#C9D8FF" stroke-width="2"/>
  <text x="295" y="430" class="cell code">Bob</text>
  <text x="386" y="430" class="cell code">Lily</text>
  <text x="468" y="430" class="cell code">…</text>

  <path d="M 320 454 C 285 480, 225 486, 188 522" fill="none" stroke="#8EAFFB" stroke-width="3"/>
  <path d="M 395 454 L 395 522" fill="none" stroke="#246BFD" stroke-width="4"/>
  <path d="M 470 454 C 505 480, 565 486, 602 522" fill="none" stroke="#8EAFFB" stroke-width="3"/>

  <text x="115" y="519" class="node-title">LEAF PAGES</text>
  <rect x="102" y="535" width="172" height="126" rx="14" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
  <text x="121" y="562" class="label">page 1</text>
  <line x1="102" y1="575" x2="274" y2="575" stroke="#E2E7EB" stroke-width="2"/>
  <text x="121" y="605" class="cell code">Alice</text>
  <text x="218" y="605" class="cell code">id=3</text>
  <rect x="116" y="583" width="134" height="30" rx="8" fill="#FFF0D4" stroke="#F59E0B" stroke-width="2"/>
  <text x="134" y="605" class="cell code highlight">Alice → 3</text>
  <text x="121" y="638" class="cell code">Bob</text>
  <text x="218" y="638" class="cell code">id=7</text>

  <rect x="302" y="535" width="172" height="126" rx="14" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
  <text x="321" y="562" class="label">page 2</text>
  <line x1="302" y1="575" x2="474" y2="575" stroke="#E2E7EB" stroke-width="2"/>
  <text x="321" y="605" class="cell code">Lily</text>
  <text x="418" y="605" class="cell code">id=9</text>
  <text x="321" y="638" class="cell code">Jack</text>
  <text x="418" y="638" class="cell code">id=11</text>

  <rect x="502" y="535" width="182" height="126" rx="14" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
  <text x="521" y="562" class="label">page 3</text>
  <line x1="502" y1="575" x2="684" y2="575" stroke="#E2E7EB" stroke-width="2"/>
  <text x="521" y="605" class="cell code">Tom</text>
  <text x="618" y="605" class="cell code">id=13</text>
  <text x="521" y="638" class="cell code">Zoe</text>
  <text x="618" y="638" class="cell code">id=15</text>

  <rect x="102" y="704" width="582" height="100" rx="14" fill="#F8FAFC" stroke="#E2E7EB" stroke-width="2"/>
  <text x="124" y="735" class="note-title">查找结果</text>
  <text x="124" y="765" class="note">定位到 name = Alice，但叶子节点里 <tspan class="code">只有 id = 3</tspan>，没有 email。</text>
  <text x="124" y="788" class="note">如果只需要 id、name，那么到这里就能返回。</text>

  <!-- 聚簇索引面板 -->
  <rect x="880" y="275" width="650" height="560" rx="24" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
  <rect x="904" y="299" width="52" height="38" rx="19" fill="#E5F7F1"/>
  <text x="917" y="326" font-size="22" font-weight="700" fill="#16836F">2</text>
  <text x="972" y="327" class="panel-title">聚簇索引 PRIMARY</text>
  <text x="972" y="357" class="panel-subtitle">叶子节点直接保存：整行数据</text>

  <text x="925" y="400" class="node-title">ROOT PAGE</text>
  <rect x="1075" y="390" width="260" height="64" rx="13" fill="#F4FBF8" stroke="#16A085" stroke-width="2"/>
  <line x1="1162" y1="392" x2="1162" y2="452" stroke="#BFE8DF" stroke-width="2"/>
  <line x1="1248" y1="392" x2="1248" y2="452" stroke="#BFE8DF" stroke-width="2"/>
  <text x="1104" y="430" class="cell code">id=7</text>
  <text x="1191" y="430" class="cell code">id=13</text>
  <text x="1278" y="430" class="cell code">…</text>

  <path d="M 1130 454 C 1095 480, 1018 486, 976 522" fill="none" stroke="#77C8B8" stroke-width="3"/>
  <path d="M 1205 454 L 1205 522" fill="none" stroke="#16836F" stroke-width="4"/>
  <path d="M 1280 454 C 1315 480, 1392 486, 1434 522" fill="none" stroke="#77C8B8" stroke-width="3"/>

  <text x="925" y="519" class="node-title">LEAF PAGES · 每一行就是完整记录</text>
  <rect x="912" y="535" width="190" height="126" rx="14" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
  <text x="931" y="562" class="label">page 1</text>
  <line x1="912" y1="575" x2="1102" y2="575" stroke="#E2E7EB" stroke-width="2"/>
  <text x="931" y="600" class="small code">id=1  name=Bob</text>
  <text x="931" y="622" class="small code">email=b@x.com</text>
  <text x="931" y="649" class="small code">id=3  name=Alice</text>

  <rect x="1110" y="535" width="190" height="126" rx="14" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
  <text x="1129" y="562" class="label">page 2</text>
  <line x1="1110" y1="575" x2="1300" y2="575" stroke="#E2E7EB" stroke-width="2"/>
  <text x="1129" y="600" class="small code">id=7  name=Bob</text>
  <text x="1129" y="622" class="small code">email=bob@x</text>
  <text x="1129" y="649" class="small code">id=9  name=Lily</text>

  <rect x="1318" y="535" width="190" height="126" rx="14" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
  <text x="1337" y="562" class="label">page 3</text>
  <line x1="1318" y1="575" x2="1508" y2="575" stroke="#E2E7EB" stroke-width="2"/>
  <text x="1337" y="600" class="small code">id=13 name=Tom</text>
  <text x="1337" y="622" class="small code">email=t@x.com</text>
  <text x="1337" y="649" class="small code">id=15 name=Zoe</text>

  <!-- 回表路径 -->
  <path d="M 692 606 C 755 606, 815 606, 900 606" fill="none" stroke="#F59E0B" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <rect x="712" y="566" width="172" height="32" rx="9" fill="#FFF3D8" stroke="#F59E0B" stroke-width="2"/>
  <text x="730" y="588" class="small" font-weight="700" fill="#A04E00">用 id=3 回表</text>

  <rect x="922" y="584" width="166" height="44" rx="9" fill="#FFF0D4" stroke="#F59E0B" stroke-width="3"/>
  <text x="936" y="612" class="cell code highlight">id=3 → 定位整行</text>

  <!-- 结果卡片 -->
  <rect x="912" y="704" width="582" height="100" rx="14" fill="#F4FBF8" stroke="#CBE9E2" stroke-width="2"/>
  <text x="934" y="735" class="note-title">最终拿到整行</text>
  <text x="934" y="765" class="note"><tspan class="code">id=3, name=Alice, email=alice@x.com, …</tspan></text>
  <text x="934" y="788" class="note">再从中取出查询需要的 email，返回给客户端。</text>

  <!-- 底部结论 -->
  <rect x="70" y="865" width="1460" height="145" rx="22" fill="#17212B"/>
  <rect x="96" y="891" width="146" height="42" rx="10" fill="#F59E0B"/>
  <text x="124" y="919" font-size="18" font-weight="700" fill="#17212B">这就是“回表”</text>
  <text x="272" y="910" font-size="22" font-weight="700" fill="#FFFFFF">二级索引找到主键，再去聚簇索引取完整记录。</text>
  <text x="272" y="945" font-size="19" fill="#D7E0E8"><tspan fill="#7DE0C7" font-weight="700">覆盖索引：</tspan>如果查询只需要 id、name，name 索引里已经都有，就不用回表。</text>
  <text x="272" y="980" font-size="16" fill="#AEBBC7">代价：多一次索引查找；主键越长，二级索引叶子节点通常也越大。</text>
</svg>
